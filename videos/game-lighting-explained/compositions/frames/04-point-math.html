  <script>
    (function () {
      var chart = { x0: 70, x1: 740, y0: 10, y1: 590, dMin: 1, dMax: 6 };
      function dToX(d) {
        return chart.x0 + ((d - chart.dMin) / (chart.dMax - chart.dMin)) * (chart.x1 - chart.x0);
      }
      function vToY(v) {
        return chart.y1 - v * (chart.y1 - chart.y0);
      }
      function mainI(d) {
        return 1 / (d * d);
      }
      function altI(d) {
        var Kc = 0.1,
          Kl = 0.3,
          Kq = 0.6;
        return 1 / (Kc + Kl * d + Kq * d * d);
      }
      function buildPath(fn, dStart, dEnd, steps) {
        var pts = [];
        for (var i = 0; i <= steps; i++) {
          var d = dStart + ((dEnd - dStart) * i) / steps;
          var x = dToX(d);
          var y = vToY(fn(d));
          pts.push(x.toFixed(2) + "," + y.toFixed(2));
        }
        return "M" + pts.join(" L");
      }

      var cutoffD = 4.5;

      tl.fromTo(

      tl.fromTo(

      tl.fromTo(

        4.93,

      /* keyword-glow (asr-keyword-glow, single-value form): fire-orange flash on landing.
         Written directly to both the digits and the suffix (not the wrapper) because
         each has its own explicit CSS `color`, which would otherwise win over anything
         inherited from a parent. */
      var pmGlowEls = [
        document.getElementById("x04-point-math-counter"),
        document.getElementById("x04-point-math-counter-suffix"),
      ];
      var GLOW_ATTACK = 0.12,
        GLOW_RELEASE = 0.35,
        GLOW_REST = 0.12,
        GLOW_MAXBLUR = 34;
      var GLOW_REST_RGB = { r: 240, g: 236, b: 229 };
      var GLOW_PEAK_RGB = { r: 232, g: 93, b: 38 };
      function pmGlowEnvelope(t, start, end) {
        if (t < start) return 0;
        if (t < end) return Math.min((t - start) / GLOW_ATTACK, 1);
        var releaseEnd = end + GLOW_RELEASE;
        if (t < releaseEnd) return 1 - ((t - end) / GLOW_RELEASE) * (1 - GLOW_REST);
        return GLOW_REST;
      }
      var pmGlowDriver = { t: 0 };

        pmGlowDriver,
        {
          t: 1,
          duration: 1.15,
          ease: "none",

            var shadow = "0 0 " + blur + "px rgba(232,93,38," + (env * 0.9).toFixed(2) + ")";
            var r = Math.round(GLOW_REST_RGB.r + (GLOW_PEAK_RGB.r - GLOW_REST_RGB.r) * env);
            var g = Math.round(GLOW_REST_RGB.g + (GLOW_PEAK_RGB.g - GLOW_REST_RGB.g) * env);

            var color = "rgb(" + r + "," + g + "," + b + ")";
