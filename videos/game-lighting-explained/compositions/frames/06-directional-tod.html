<script>
  (function () {
    // ---- svg-path-draw setup: measure real geometry, never guess ----
    ["tod-wedge-outline", "tod-divider-1", "tod-divider-2"].forEach(function (id) {
      var el = document.getElementById(id);
      var len = el.getTotalLength();
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // ================= Scene 1 (0.0-4.6s) — arrival =================

    // transform already centers them, so GSAP never touches transform here)
    tl.fromTo(".tod-glow-left", { opacity: 0 }, { opacity: 0.07, duration: 1.2, ease: "power1.out" }, 0.2);
    tl.fromTo(".tod-glow-right", { opacity: 0 }, { opacity: 0.11, duration: 1.2, ease: "power1.out" }, 0.2);

    // kicker + headline slide down into place
    tl.fromTo(
      ".tod-kicker, .tod-headline",
      { y: -22, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 },
      0,
    );

    // divider hairline
    tl.fromTo(".tod-divider", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.5);

    // split-tilt-cards signature entry — mirrored book-open tilt from opposite wings
    tl.fromTo(
      "#tod-card-left",
      { x: -300, rotateY: 22, opacity: 0 },
      { x: 0, rotateY: 14, opacity: 1, duration: 0.9, ease: "power3.out" },
      0.15,
    );
    tl.fromTo(
      "#tod-card-right",
      { x: 300, rotateY: -22, opacity: 0 },
      { x: 0, rotateY: -14, opacity: 1, duration: 0.9, ease: "power3.out" },
      0.35,
    );

    // panel content (arc, ground, arrow, sun) fades up during the settle tail

      "#tod-content-left",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      0.65,
    );
    tl.fromTo(
      "#tod-content-right",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      0.85,
    );
    tl.fromTo("#tod-tag-left", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.6);
    tl.fromTo("#tod-tag-right", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.8);

    // counter-phase idle bob — left up / right down, never synchronized

    tl.to("#tod-card-right", { y: 6, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 11 }, 1.4);

    // ================= Scene 2 (4.6-8.7s) — TOD parameters =================
    // left: "真上の白は正午" — keyword emphasis + sun dot climbs to the arc apex
    tl.fromTo(
      "#tod-tag-left",
      { filter: "brightness(1)", scale: 1 },
      { filter: "brightness(1.35)", scale: 1.08, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 },
      4.3,
    );
    tl.fromTo(
      ".tod-dot-left",
      { attr: { cx: 312, cy: 218 } },
      { attr: { cx: 360, cy: 215 }, duration: 0.75, ease: "power2.out" },
      4.3,
    );

    // right: "低いオレンジは夕暮れ" — keyword emphasis + sun dot sinks toward the horizon
    tl.fromTo(
      "#tod-tag-right",
      { filter: "brightness(1)", scale: 1 },
      { filter: "brightness(1.35)", scale: 1.08, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 },
      6.0,
    );
    tl.fromTo(
      ".tod-dot-right",
      { attr: { cx: 528, cy: 254 } },
      { attr: { cx: 612, cy: 303 }, duration: 0.75, ease: "power2.out" },
      6.0,
    );
    tl.fromTo(
      "#tod-tint-right",
      { opacity: 0 },
      { opacity: 0.32, duration: 1.0, ease: "sine.inOut" },
      6.0,
    );

    // ================= Scene 3 (8.7-13.3s) — CSM cascades self-draw =================
    tl.fromTo("#tod-cam-dot, #tod-cam-ring", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 8.7);

    tl.to("#tod-wedge-outline", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 8.9);
    tl.to("#tod-divider-1", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 9.5);
    tl.to("#tod-divider-2", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 9.95);

    // draw-then-fill: near cascade first (smallest, highest resolution) through far (largest, coarsest)
    tl.fromTo("#tod-fill-near", { attr: { "fill-opacity": 0 } }, { attr: { "fill-opacity": 0.3 }, duration: 0.4, ease: "power1.out" }, 9.6);
    tl.fromTo("#tod-grid-near", { opacity: 0 }, { opacity: 0.6, duration: 0.4, ease: "power1.out" }, 9.6);
    tl.fromTo("#tod-label-near", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 9.9);
