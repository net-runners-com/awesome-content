    #root {

      inset: 0;
      overflow: hidden;
      --ink-black: #111111;
      --ink-black-alt: #1a1a18;
      --fire-orange: #e85d26;
      --cream: #f0ece5;
      --cream-hint: #505048;
      --border-dark: #282826;

    .tl3-scene {

      overflow: hidden;
      background-color: var(--ink-black);
    }
    .tl3-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:

      opacity: 0.45;
      pointer-events: none;

    /* header */
    .tl3-header {
      position: absolute;
      top: 96px;

      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .tl3-eyebrow-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }
    #tl3-eyebrow,
    #tl3-eyebrow-cursor {
      font-family: "IBM Plex Mono", ui-monospace, monospace;

      font-size: 20px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fire-orange);
      white-space: nowrap;
    }
    #tl3-eyebrow-cursor {
      display: inline-block;
      width: 12px;
    }
    #tl3-h2 {
      font-family: "Barlow", "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: 86px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--cream);
      text-align: center;
      white-space: nowrap;
    }
    .tl3-h2-word {
      display: inline-block;
    }

    /* triptych */
    .tl3-triptych {
      position: absolute;
      top: 300px;
      left: 192px;
      width: 1536px;
      height: 540px;
      display: flex;
      gap: 48px;
    }
    .tl3-card {
      position: relative;
      width: 480px;
      height: 540px;
      box-sizing: border-box;
      background: var(--ink-black-alt);
      border: 1px solid var(--border-dark);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: 50% 50%;
    }
    .tl3-icon-wrap {
      width: 172px;
      height: 172px;
      margin-bottom: 26px;
      flex-shrink: 0;
    }
    .tl3-icon-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .tl3-card-title {
      font-family: "Barlow", "Noto Sans JP", sans-serif;
      font-weight: 600;
      font-size: 54px;
      line-height: 1.2;
      color: var(--cream);
      text-align: center;
      min-height: 132px;
      width: 100%;
    }
    .tl3-num {
      position: absolute;
      top: 24px;
      left: 28px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.05em;
      color: var(--fire-orange);
      transform-origin: 0% 50%;
    }

    /* icon strokes */
    .tl3-draw {
      fill: none;
      stroke: var(--fire-orange);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tl3-tick {
      fill: none;
      stroke: var(--fire-orange);
      stroke-width: 5;
      stroke-linecap: round;
    }
    .tl3-fire-fill {
      fill: var(--fire-orange);
    }
  </style>

  <div id="root" data-composition-id="02-three-lights" data-width="1920" data-height="1080" data-duration="12.055">
    <div id="tl3-scene" class="clip tl3-scene" data-start="0" data-duration="12.055" data-track-index="1">
      <div class="tl3-header">
        <div class="tl3-eyebrow-row">
          <span id="tl3-eyebrow"></span><span id="tl3-eyebrow-cursor">_</span>
        </div>
        <div id="tl3-h2">
          <span class="tl3-h2-word">光源は、</span><span class="tl3-h2-word">実質</span
          ><span class="tl3-h2-word">この</span><span class="tl3-h2-word">3つ</span>
        </div>
      </div>

      <div class="tl3-triptych">
        <!-- Card 1: 点光源 (Point Light) -->
        <div id="tl3-card-1" class="tl3-card">
          <span id="tl3-num-1" class="tl3-num">01</span>
          <div class="tl3-icon-wrap">
            <svg viewBox="0 0 160 160">
              <circle id="tl3-point-dot" class="tl3-fire-fill" cx="80" cy="80" r="9" />
              <line id="tl3-point-line-0" class="tl3-draw" x1="95.6" y1="95.6" x2="125.3" y2="125.3" />
              <line id="tl3-point-line-1" class="tl3-draw" x1="64.4" y1="95.6" x2="34.8" y2="125.3" />
              <line id="tl3-point-line-2" class="tl3-draw" x1="64.4" y1="64.4" x2="34.8" y2="34.8" />
              <line id="tl3-point-line-3" class="tl3-draw" x1="95.6" y1="64.4" x2="125.3" y2="34.8" />
            </svg>
          </div>
          <div id="tl3-title-1" class="tl3-card-title">点光源</div>
        </div>

        <!-- Card 2: ディレクショナルライト (Directional Light) -->
        <div id="tl3-card-2" class="tl3-card">
          <span id="tl3-num-2" class="tl3-num">02</span>
          <div class="tl3-icon-wrap">
            <svg viewBox="0 0 160 160">
              <line id="tl3-dir-line-0" class="tl3-draw" x1="95" y1="10" x2="15" y2="90" />
              <line id="tl3-dir-line-1" class="tl3-draw" x1="120" y1="35" x2="40" y2="115" />
              <line id="tl3-dir-line-2" class="tl3-draw" x1="145" y1="60" x2="65" y2="140" />
              <polygon id="tl3-dir-arrow-0" class="tl3-fire-fill" points="7.9,97.1 20,94.9 10,85.1" />
              <polygon id="tl3-dir-arrow-1" class="tl3-fire-fill" points="32.9,122.1 45,120 35,110.1" />
              <polygon id="tl3-dir-arrow-2" class="tl3-fire-fill" points="57.9,147.1 70,145 60,135.1" />
            </svg>
          </div>
          <div id="tl3-title-2" class="tl3-card-title">ディレクショナルライト</div>
        </div>

        <!-- Card 3: 環境光 (Ambient Light) -->
        <div id="tl3-card-3" class="tl3-card">
          <span id="tl3-num-3" class="tl3-num">03</span>
          <div class="tl3-icon-wrap">
            <svg viewBox="0 0 160 160">
              <path id="tl3-dome-arc" class="tl3-draw" d="M 20 130 A 60 60 0 0 1 140 130" />
              <line id="tl3-dome-tick-0" class="tl3-tick" x1="28" y1="100" x2="43.6" y2="109" />
              <line id="tl3-dome-tick-1" class="tl3-tick" x1="50" y1="78" x2="59" y2="93.6" />
              <line id="tl3-dome-tick-2" class="tl3-tick" x1="80" y1="70" x2="80" y2="88" />
              <line id="tl3-dome-tick-3" class="tl3-tick" x1="110" y1="78" x2="101" y2="93.6" />
              <line id="tl3-dome-tick-4" class="tl3-tick" x1="132" y1="100" x2="116.4" y2="109" />
            </svg>
          </div>
          <div id="tl3-title-3" class="tl3-card-title">環境光</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ---------- Scene 1 (0.0-3.14s): eyebrow type-on + H2 per-word reveal ---------- */

    const EYEBROW_TEXT = "REALTIME LIGHTING";
    const eyebrowEl = document.getElementById("tl3-eyebrow");
    const eyebrowLen = { v: 0 };
    tl.to(
      eyebrowLen,
      {
        v: EYEBROW_TEXT.length,
        duration: 1.28,
        ease: "power1.inOut",
        onUpdate: () => {
          eyebrowEl.textContent = EYEBROW_TEXT.substring(0, Math.floor(eyebrowLen.v));
        },
      },
      0.17,
    );

    // cursor blink - deterministic sin square wave, never a CSS animation
    const cursorEl = document.getElementById("tl3-eyebrow-cursor");
    const blink = { p: 0 };
    tl.to(
      blink,
      {
        p: Math.PI * 2 * 3.6,
        duration: 2.97,
        ease: "none",
        onUpdate: () => {
          cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
        },
      },
      0.17,
    );

    // H2 per-word staggered reveal
    gsap.utils.toArray(".tl3-h2-word").forEach((el, i) => {
      tl.fromTo(
        el,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.47, ease: "power2.out" },
        1.51 + i * 0.16,
      );
    });

    /* ---------- Scene 2 (3.14-9.44s): card cascade + icon self-draw ---------- */

    const CARD1_START = 3.2;
    const CARD2_START = 5.47;
    const CARD3_START = 7.69;

    function popCard(cardSel, titleSel, start) {
      tl.fromTo(
        cardSel,
        { scale: 0, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.64, ease: "power3.out" },
        start,
      );
      tl.fromTo(
        titleSel,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.41, ease: "power2.out" },
        start + 0.17,
      );
    }

    popCard("#tl3-card-1", "#tl3-title-1", CARD1_START);
    popCard("#tl3-card-2", "#tl3-title-2", CARD2_START);
    popCard("#tl3-card-3", "#tl3-title-3", CARD3_START);

    // measure every drawable path once, at build time
    document.querySelectorAll(".tl3-draw").forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = String(len);
      p.style.strokeDashoffset = String(len);
    });

    // Card 1 icon - point light: center dot pop + 4 radiating spokes
    tl.fromTo(
      "#tl3-point-dot",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.29, ease: "power3.out", transformOrigin: "50% 50%" },
      CARD1_START + 0.29,
    );
    [0, 1, 2, 3].forEach((i) => {
      tl.to(
        `#tl3-point-line-${i}`,
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        CARD1_START + 0.52 + i * 0.26,
      );
    });

    // Card 2 icon - directional: 3 parallel rays, each capped with an arrowhead
    [0, 1, 2].forEach((i) => {
      const segStart = CARD2_START + 0.41 + i * 0.35;
      tl.to(
        `#tl3-dir-line-${i}`,
        { strokeDashoffset: 0, duration: 0.47, ease: "power2.out" },
        segStart,
      );
      tl.fromTo(
        `#tl3-dir-arrow-${i}`,
        { opacity: 0, scale: 0.5 },
        { opacity: 1, scale: 1, duration: 0.23, ease: "power3.out", transformOrigin: "50% 50%" },
        segStart + 0.47,
      );
    });

    // Card 3 icon - ambient: dome arc self-draws, then 5 inward wrap ticks
    tl.to("#tl3-dome-arc", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, CARD3_START + 0.41);
    [0, 1, 2, 3, 4].forEach((i) => {
      tl.fromTo(
        `#tl3-dome-tick-${i}`,
        { opacity: 0 },
        { opacity: 0.85, duration: 0.17, ease: "power1.out" },
        CARD3_START + 1.16 + i * 0.07,
      );
    });

    /* ---------- Scene 3 (9.44-11.56s): mono index numerals tick in, then hold to 12.055s ---------- */

    [
      ["#tl3-num-1", 9.49],
      ["#tl3-num-2", 9.67],
      ["#tl3-num-3", 9.84],
    ].forEach(([sel, start]) => {
      tl.fromTo(
        sel,
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out", transformOrigin: "0% 50%" },
        start,
      );
    });

    window.__timelines["02-three-lights"] = tl;
  </script>
</template>
