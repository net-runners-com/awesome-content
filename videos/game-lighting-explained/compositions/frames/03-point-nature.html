<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  /* ================================================================
     SETUP — measured stroke draws (never hard-coded lengths)
     ================================================================ */
  const rayEls = document.querySelectorAll(".point-nature-03-ray");
  rayEls.forEach((r) => {
    const len = r.getTotalLength();
    r.style.strokeDasharray = String(len);
    r.style.strokeDashoffset = String(len);
  });

  const ringEls = [
    document.getElementById("point-nature-03-ring-1"),
    document.getElementById("point-nature-03-ring-2"),
    document.getElementById("point-nature-03-ring-3"),
  ];
  ringEls.forEach((ring) => {
    const len = ring.getTotalLength();
    ring.style.strokeDasharray = String(len);
    ring.style.strokeDashoffset = String(len);
  });

  // Node fills start collapsed ("unlit") — GSAP fromTo grows them, never CSS-hidden alone.
  // (transform-origin is pinned per-node in CSS above, not here, so it isn't overwritten.)
  gsap.set(
    ["#point-nature-03-node-fill-1", "#point-nature-03-node-fill-2", "#point-nature-03-node-fill-3"],
    { scale: 0, opacity: 0 },
  );

  const centerDot = document.getElementById("point-nature-03-center-dot");
  const glowEl = document.getElementById("point-nature-03-glow");

  /* ================================================================
     SCENE 1 (0.0 - 4.18s) — eyebrow + h3 per-word reveal; on the VO cue
     ("一点から全方向に") the point ignites (ambient-glow-bloom) and
     radiating rays self-draw outward (svg-path-draw, staggered).
     ================================================================ */
  const kickerWords = document.querySelectorAll(".point-nature-03-kicker-word");
  tl.fromTo(
    kickerWords,
    { y: 10, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.37, ease: "power2.out", stagger: 0.08 },
    0.06,
  );
  tl.fromTo(
    "#point-nature-03-headline",
    { y: 14, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
    0.64,
  );

  const GLOW_START = 1.86;
  const GLOW_DUR = 0.81;
  const GLOW_PEAK = 0.3;

  tl.fromTo(
    "#point-nature-03-glow",
    { opacity: 0, scale: 0.82 },
    { opacity: GLOW_PEAK, scale: 1, duration: GLOW_DUR, ease: "power2.out" },
    GLOW_START,
  );
  tl.fromTo(
    centerDot,
    { opacity: 0.12, scale: 0.6, svgOrigin: "960 454" },
    { opacity: 1, scale: 1, svgOrigin: "960 454", duration: GLOW_DUR, ease: "power2.out" },
    GLOW_START,
  );

  const RAYS_START = 2.03;
  tl.to(
    ".point-nature-03-ray",
    { strokeDashoffset: 0, duration: 0.58, ease: "power2.out", stagger: 0.06 },
    RAYS_START,
  );

  /* ================================================================
     SCENE 2 (4.18 - 8.35s) — the example chip enters once, then hard-cuts
     its text between the three example words as the VO speaks them
     (discrete-text-sequence: instant jumps, reverse-search by time).
     ================================================================ */
  tl.fromTo(
    "#point-nature-03-chip",
    { scale: 0.85, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.46, ease: "back.out(1.4)" },
    4.18,
  );

  const CHIP_SEQUENCE = [
    { t: 4.18, text: "たいまつ" },
    { t: 5.68, text: "ランプ" },
    { t: 7.08, text: "マズルフラッシュ" },
  ];
  function chipTextAt(time) {
    for (let i = CHIP_SEQUENCE.length - 1; i >= 0; i -= 1) {
      if (time >= CHIP_SEQUENCE[i].t) return CHIP_SEQUENCE[i].text;
    }
    return "";
  }
  const chipTextEl = document.getElementById("point-nature-03-chip-text");
  const chipDriver = { t: 4.18 };
  tl.to(
    chipDriver,
    {
      t: 7.31,
      duration: 3.13,
      ease: "none",
      onUpdate: () => {
        chipTextEl.textContent = chipTextAt(chipDriver.t);
      },
    },
    4.18,
  );
  // Hard-cut swap pulse — a small bounded snap on each of the later word changes.
  tl.to("#point-nature-03-chip-text", { scale: 1.06, duration: 0.17, yoyo: true, repeat: 1 }, 5.68);
  tl.to("#point-nature-03-chip-text", { scale: 1.06, duration: 0.17, yoyo: true, repeat: 1 }, 7.08);

  // Recede the chip once Scene 3 shifts focus to the rings (no hard exit — a quiet dim).
  tl.to("#point-nature-03-chip", { opacity: 0.4, duration: 0.7, ease: "power1.out" }, 8.35);

  /* ================================================================
     SCENE 3 (8.35 - 14.27s) — equal-distance rings self-draw in order;
     each ring's marker lights up (stat-bars-and-fills fill applied to
     brightness), dimmer the farther out — attenuation, shown not told.
     ================================================================ */
  const RING_DUR = 0.7;
  tl.to("#point-nature-03-ring-1", { strokeDashoffset: 0, duration: RING_DUR, ease: "power2.out" }, 8.58);
  tl.fromTo(
    "#point-nature-03-node-fill-1",
    { scale: 0, opacity: 0 },
    { scale: 1, opacity: 1.0, duration: 0.41, ease: "back.out(1.3)" },
    9.16,
  );
  tl.fromTo("#point-nature-03-label-d1", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power1.out" }, 9.16);

  tl.to("#point-nature-03-ring-2", { strokeDashoffset: 0, duration: RING_DUR, ease: "power2.out" }, 9.86);
  tl.fromTo(
    "#point-nature-03-node-fill-2",
    { scale: 0, opacity: 0 },
    { scale: 1, opacity: 0.55, duration: 0.41, ease: "back.out(1.3)" },
    10.44,
  );
  tl.fromTo("#point-nature-03-label-d2", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power1.out" }, 10.44);

  tl.to("#point-nature-03-ring-3", { strokeDashoffset: 0, duration: RING_DUR, ease: "power2.out" }, 11.14);
  tl.fromTo(
    "#point-nature-03-node-fill-3",
    { scale: 0, opacity: 0 },
    { scale: 1, opacity: 0.22, duration: 0.41, ease: "back.out(1.3)" },
    11.72,
  );
  tl.fromTo("#point-nature-03-label-d3", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power1.out" }, 11.72);

  /* ================================================================
     SCENE 4 (14.27 - 17.258s) — hold: only the center glow's residual
     breathe and a subtle jitter on the point (bounded, finite, seek-safe).
     Final hold extends to the padded root (17.258s) — no exit tween.
     ================================================================ */
  const BREATHE_START = 14.27;
  const BREATHE_DUR = 17.258 - BREATHE_START;
  const OPACITY_AMP = 0.03;
  const SCALE_AMP = 0.015;
  const JITTER_AMP_X = 2.2;
  const JITTER_AMP_Y = 1.6;

  const holdPhase = { p: 0 };
  tl.to(
    holdPhase,
    {
      p: Math.PI * 2 * 0.85,
      duration: BREATHE_DUR,
      ease: "none",
      onUpdate: () => {
        const s = Math.sin(holdPhase.p);
        glowEl.style.opacity = String(GLOW_PEAK + s * OPACITY_AMP);
        glowEl.style.transform = `scale(${1 + s * SCALE_AMP})`;

        const localT = holdPhase.p; // monotonic proxy for elapsed hold time
        const jx = Math.sin(localT * 1.7) * JITTER_AMP_X;
        const jy = Math.cos(localT * 1.3) * JITTER_AMP_Y;
        gsap.set(centerDot, { x: jx, y: jy });
      },
    },
    BREATHE_START,
  );

  window.__timelines["03-point-nature"] = tl;
</script>
