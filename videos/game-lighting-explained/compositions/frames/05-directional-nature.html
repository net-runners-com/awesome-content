      6.95,
    );
    tl.fromTo(
      "#f05-vector-badge",
      { scale: 0.6, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.33, ease: "back.out(1.5)" },
      7,
    );
    tl.fromTo(
      "#f05-vector-label-wrap",
      { x: -8, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.39, ease: "power2.out" },
      7.11,
    );

    // asr-keyword-glow: vector L emphasis, single driver over a 1.32s window
    const glowLine = document.getElementById("f05-vector-line");
    const glowLabel = document.getElementById("f05-vector-label");
    const glowBadge = document.getElementById("f05-vector-badge");
    const GLOW_ATTACK = 0.2;
    const GLOW_RELEASE = 0.39;
    const GLOW_REST = 0.22;
    function glowEnvelope(t, start, end) {
      if (t < start) return 0;
      if (t < end) return Math.min((t - start) / GLOW_ATTACK, 1);
      const releaseEnd = end + GLOW_RELEASE;
      if (t < releaseEnd) return 1 - ((t - end) / GLOW_RELEASE) * (1 - GLOW_REST);
      return GLOW_REST;
    }
    const glowDriver = { t: 0 };
    tl.to(
      glowDriver,
      {
        t: 1.32,
        duration: 1.32,
        ease: "none",
        onUpdate: () => {
          const env = glowEnvelope(glowDriver.t, 0.17, 0.72);
          glowLabel.style.textShadow = `0 0 ${24 * env}px rgba(232,93,38,${0.25 + 0.7 * env})`;
          glowLabel.style.transform = `scale(${1 + 0.14 * env})`;
          glowLine.setAttribute("stroke-width", String(10 + 3 * env));
          glowLine.style.filter = `drop-shadow(0 0 ${9 * env}px rgba(232,93,38,${0.3 + 0.55 * env}))`;
          glowBadge.style.filter = `drop-shadow(0 0 ${9 * env}px rgba(232,93,38,${0.4 * env}))`;
        },
      },
      7.55,
    );

    // ---------- Scene 3 (8.71s - 13.01s): three cubes, equal brightness counters ----------
    tl.fromTo(
      "#f05-cube-icon-far",
      { scale: 0.6, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.33, ease: "power3.out" },
      8.76,
    );
    tl.fromTo(
      "#f05-cube-icon-mid",
      { scale: 0.6, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.33, ease: "power3.out" },
      8.9,
    );
    tl.fromTo(
      "#f05-cube-icon-near",
      { scale: 0.6, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.33, ease: "power3.out" },
      9.03,
    );
    tl.from("#f05-label-far", { opacity: 0, y: 12, duration: 0.55, ease: "power2.out" }, 8.76);
    tl.from("#f05-label-mid", { opacity: 0, y: 12, duration: 0.55, ease: "power2.out" }, 8.9);
    tl.from("#f05-label-near", { opacity: 0, y: 12, duration: 0.55, ease: "power2.out" }, 9.03);

    // counting-dynamic-scale: three counters, shared timing = one chord
    const COUNT_START = 8.93;
    const COUNT_DUR = 1.98;
    const COUNT_EASE = "power3.out";
    const START_SIZE = 40;
    const END_SIZE = 88;
    const START_SCALE = START_SIZE / END_SIZE;

    ["far", "mid", "near"].forEach((depth) => {
      const counterEl = document.getElementById("f05-counter-" + depth);
      const suffixEl = document.getElementById("f05-suffix-" + depth);
      const state = { value: 0 };
      tl.to(
        state,
        {
          value: 100,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: () => {
            counterEl.textContent = Math.round(state.value).toLocaleString();
          },
        },
        COUNT_START,
      );
      tl.fromTo(
        counterEl,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_START,
      );
      tl.to(
        suffixEl,
        { opacity: 1, y: 0, duration: 0.44, ease: "back.out(1.6)" },
        COUNT_START + COUNT_DUR,
      );
    });

    tl.fromTo(
      "#f05-nofalloff",
      { y: 10, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" },
      11.41,
    );

    // ---------- Scene 4 (13.01s - 15.147s): hold, subtle jitter on the ray bundle ----------
    tl.to("#f05-rays-wrap", { x: 4, duration: 0.44, ease: "sine.inOut" }, 13.12);
    tl.to("#f05-rays-wrap", { x: -3, duration: 0.55, ease: "sine.inOut" }, 13.56);
    tl.to("#f05-rays-wrap", { x: 2, duration: 0.55, ease: "sine.inOut" }, 14.11);
    tl.to("#f05-rays-wrap", { x: 0, duration: 1.087, ease: "sine.inOut" }, 14.66);

    window.__timelines["05-directional-nature"] = tl;
  })();
</script>
