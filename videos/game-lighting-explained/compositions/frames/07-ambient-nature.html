  </style>

  <script>
    (function () {
      var prand = function (n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      var arcPath = document.getElementById('amb07-arc');
      var groundLine = document.getElementById('amb07-ground');
      var arrowsField = document.getElementById('amb07-arrows');
      var particleField = document.getElementById('amb07-particle-field');
      var sourceGlyph = document.getElementById('amb07-source-glyph');
      var sphereGlow = document.getElementById('amb07-sphere-glow');
      var kaValueEl = document.getElementById('amb07-ka-value');
      var eyebrowEl = document.getElementById('amb07-eyebrow');
      var h3El = document.getElementById('amb07-h3');
      var formulaLabelEl = document.getElementById('amb07-formula-label');
      var termAmbient = document.getElementById('amb07-term-ambient');
      var termEq = document.getElementById('amb07-term-eq');
      var termKa = document.getElementById('amb07-term-ka');
      var termTimes = document.getElementById('amb07-term-times');
      var termSky = document.getElementById('amb07-term-sky');
      var glowEl = document.getElementById('amb07-glow');
      var washEl = document.getElementById('amb07-stage-wash');

      /* ---- self-draw setup: dome arc + ground line (dasharray is static, dashoffset is the reveal) ---- */
      var arcLen = arcPath.getTotalLength();
      gsap.set(arcPath, { strokeDasharray: arcLen });
      var groundLen = 1000; /* |1460 - 460| */
      gsap.set(groundLine, { strokeDasharray: groundLen });

      /* ---- ray data: outer point on the dome, inward delta toward the sphere ---- */
      var rays = [
        { ox: 468,  oy: 613, dx: 206,  dy: 37,  rot: 10 },
        { ox: 527,  oy: 450, dx: 182,  dy: 105, rot: 30 },
        { ox: 639,  oy: 317, dx: 135,  dy: 161, rot: 50 },
        { ox: 789,  oy: 230, dx: 72,   dy: 197, rot: 70 },
        { ox: 960,  oy: 200, dx: 0,    dy: 210, rot: 90 },
        { ox: 1131, oy: 230, dx: -72,  dy: 197, rot: 110 },
        { ox: 1282, oy: 317, dx: -135, dy: 161, rot: 130 },
        { ox: 1393, oy: 450, dx: -182, dy: 105, rot: 150 },
        { ox: 1453, oy: 613, dx: -206, dy: 37,  rot: 170 }
      ];
      var arrowEls = rays.map(function (r) {
        var el = document.createElement('div');
        el.className = 'amb07-arrow';
        el.style.left = r.ox + 'px';
        el.style.top = r.oy + 'px';
        arrowsField.appendChild(el);
        return el;
      });

      /* ---- dissolve particle pool: seeded once, positions are pure functions of T ---- */
      var PARTICLE_COUNT = 26;
      var palette = ['#F0ECE5', '#E85D26', '#888880'];
      var BLOCK_W = 90, BLOCK_H = 90, G_DISSOLVE = 60;
      var parts = [];
      for (var i = 0; i < PARTICLE_COUNT; i++) {
        var el = document.createElement('div');
        el.className = 'amb07-particle';
        var size = 4 + prand(i * 3 + 1) * 3;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.background = palette[i % palette.length];
        particleField.appendChild(el);
        var ox = (prand(i * 13 + 5) - 0.5) * BLOCK_W;
        var oy = (prand(i * 19 + 9) - 0.5) * BLOCK_H;
        var angle = prand(i * 5 + 2) * Math.PI * 2;
        var speed = 60 + prand(i * 7 + 3) * 80;
        parts.push({
          el: el,
          ox: ox,
          oy: oy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed
        });
      }

      /* ---- timeline ---- */
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-4.62s): chrome intro, dome self-draws overhead, source glyph settles in,
         light arrows converge inward from the arc (center-outward-expansion, reversed). */
      tl.fromTo(eyebrowEl, { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.59, ease: 'power2.out' }, 0.06);
      tl.fromTo(arcPath, { strokeDashoffset: arcLen }, { strokeDashoffset: 0, duration: 1.66, ease: 'power2.inOut' }, 0.18);
      tl.fromTo(h3El, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.59, ease: 'power2.out' }, 0.36);
      tl.fromTo(groundLine, { strokeDashoffset: groundLen }, { strokeDashoffset: 0, duration: 0.59, ease: 'power2.out' }, 0.41);
      tl.fromTo('#amb07-sphere-wrap', { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.59, ease: 'power2.out' }, 0.65);
      tl.fromTo(sourceGlyph, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.59, ease: 'power2.out' }, 1.13);

      var ARROW_ENTRY_AT = 1.84, ARROW_STAGGER = 0.07, ARROW_DUR = 1.42;
      arrowEls.forEach(function (el, i) {
        var r = rays[i];
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, rotation: r.rot, scale: 0.6, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: r.dx, y: r.dy, rotation: r.rot, scale: 1, opacity: 1, duration: ARROW_DUR, ease: 'power3.out' },
          ARROW_ENTRY_AT + i * ARROW_STAGGER
        );
      });

      /* Scene 2 (4.62-8.77s): the placeholder source dissolves - there is no source - then
         the stage brightens very slightly (particle-burst, glyph-dissolve variant). */
      var BURST_AT = 5.10, FLIGHT_DUR = 1.54;
      tl.fromTo(sourceGlyph, { opacity: 1 }, { opacity: 0, duration: 0.47, ease: 'power1.out' }, BURST_AT);
      var drive = { T: 0 };
      tl.fromTo(
        drive,
        { T: 0 },
        {
          T: 1,
          duration: FLIGHT_DUR,
          ease: 'none',
          onUpdate: function () {
            var t = drive.T * FLIGHT_DUR;
            var fadeIn = Math.min(1, drive.T / 0.15);
            var fadeOut = Math.min(1, (1 - drive.T) / 0.3);
            var op = drive.T === 0 ? 0 : Math.min(fadeIn, fadeOut);
            for (var p = 0; p < parts.length; p++) {
              var part = parts[p];
              var x = part.ox + part.vx * t;
              var y = part.oy + part.vy * t + 0.5 * G_DISSOLVE * t * t;
              part.el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
              part.el.style.opacity = String(op);
            }
          }
        },
        BURST_AT
      );
      tl.fromTo(glowEl, { opacity: 0.08 }, { opacity: 0.16, duration: 1.90, ease: 'power1.inOut' }, 6.64);
      tl.fromTo(washEl, { opacity: 0 }, { opacity: 0.05, duration: 1.90, ease: 'power1.inOut' }, 6.64);

      /* Scene 3 (8.77-13.98s): ambient = ka x skyColor builds term by term; the test sphere's
         brightness lifts uniformly with the ka tick (counting-dynamic-scale, small). Every
         reveal here lands and settles well before ~12.80s so nothing is caught mid-fade. */
      tl.fromTo(termAmbient, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.41, ease: 'power2.out' }, 8.77);
      tl.fromTo(termEq, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: 'power2.out' }, 9.18);
      tl.fromTo(termKa, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.41, ease: 'power2.out' }, 9.54);

      var kaState = { value: 0 };
      var COUNT_DUR = 1.78, COUNT_EASE = 'power2.out', START_SCALE = 0.85;
      tl.to(kaState, {
        value: 0.35,
        duration: COUNT_DUR,
        ease: COUNT_EASE,
        onUpdate: function () {
          kaValueEl.textContent = kaState.value.toFixed(2);
        }
      }, 9.95);
      tl.fromTo(kaValueEl, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, 9.95);
      tl.fromTo(sphereGlow, { opacity: 0.16 }, { opacity: 0.68, duration: COUNT_DUR, ease: COUNT_EASE }, 9.95);

      tl.fromTo(termTimes, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: 'power2.out' }, 11.73);
      tl.fromTo(termSky, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.41, ease: 'power2.out' }, 12.09);
      tl.fromTo(formulaLabelEl, { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.53, ease: 'power2.out' }, 12.26);

      /* Scene 4 (13.98s-end): hold - the lit scene settles, nothing new front-loads. */

      window.__timelines['07-ambient-nature'] = tl;
    })();
  </script>
