<meta charset="utf-8">
<title>Molecule Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root { --ink: #0E1430; --paper: #F4F1E8; --aqua: #3EE0D8; --dim: #9AA3C7; --panel: rgba(14,20,48,.55); --line: rgba(244,241,232,.14); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 28px 32px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .eyebrow { font: 500 11px/1 "DM Mono", monospace; letter-spacing: .22em; text-transform: uppercase; color: var(--aqua); }
  h1 { margin: 6px 0 0; font: 800 clamp(22px, 3vw, 34px)/1.05 "Syne", sans-serif; letter-spacing: -.01em; }
  #name { margin-top: 8px; font: 700 clamp(18px, 2.4vw, 26px)/1.2 "Zen Kaku Gothic New", sans-serif; }
  #stats { margin-top: 4px; font: 400 12px/1.4 "DM Mono", monospace; color: var(--dim); font-variant-numeric: tabular-nums; }
  .hint { font: 400 12px "DM Mono", monospace; color: var(--dim); text-align: right; max-width: 34ch; }
  .bottom { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; pointer-events: auto; }
  .mol {
    appearance: none; cursor: pointer; border: 1px solid var(--line); color: var(--paper);
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font: 500 14px/1 "Zen Kaku Gothic New", sans-serif; padding: 12px 16px; border-radius: 12px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 130px;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .mol small { font: 400 11px "DM Mono", monospace; color: var(--dim); letter-spacing: .04em; }
  .mol:hover { transform: translateY(-2px); border-color: rgba(62,224,216,.5); }
  .mol.on { border-color: var(--aqua); background: rgba(62,224,216,.14); }
  .mol:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
  .legend { position: fixed; right: 32px; bottom: 32px; display: flex; gap: 12px; font: 400 11px "DM Mono", monospace; color: var(--dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  </style>
<canvas id="c"></canvas>
<div class="hud">
  <div class="top">

      <div class="eyebrow">three.js · instanced · 4 draw calls</div>

  </div>
  <div></div>
  <div class="bottom">
    <button class="mol" data-mol="0">水<small>H₂O · 3 atoms</small></button>

    <button class="mol" data-mol="2">ベンゼン<small>C₆H₆ · 12 atoms</small></button>
    <button class="mol" data-mol="3">カフェイン様<small>模式 · 二環構造</small></button>
