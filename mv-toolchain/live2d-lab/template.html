<meta charset="utf-8">
<title>Live2D Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root { --ink: #1A1633; --paper: #FFF8EE; --dim: #B9B3D6; --line: rgba(255,248,238,.16); --panel: rgba(26,22,51,.62); --pink: #FF4F9A; --aqua: #3EE0D8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(120% 90% at 50% 100%, #2A2458, #12102A 70%); color: var(--paper); font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .top { position: fixed; left: 24px; top: 20px; pointer-events: none; }
  .eyebrow { font: 500 11px "DM Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--aqua); }
  h1 { margin: 4px 0 0; font: 700 26px/1.1 "Zen Kaku Gothic New", sans-serif; }
  #params, #status { font: 400 11px/1.6 "DM Mono", monospace; color: var(--dim); margin-top: 6px; max-width: 46ch; }
  .panel { position: fixed; right: 24px; bottom: 24px; width: min(340px, calc(100vw - 48px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 10px; }
  .panel h2 { margin: 0; font: 700 12px "Zen Kaku Gothic New", sans-serif; color: var(--dim); letter-spacing: .08em; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn { appearance: none; cursor: pointer; border: 1px solid var(--line); color: var(--paper); background: transparent; font: 500 12px/1 "Zen Kaku Gothic New", sans-serif; padding: 9px 12px; border-radius: 999px; transition: .15s; }
  .btn:hover { border-color: rgba(255,248,238,.5); }
  .btn.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .btn:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
  .credit { position: fixed; left: 24px; bottom: 22px; font: 400 10.5px/1.6 "DM Mono", monospace; color: var(--dim); max-width: 48ch; }
</style>
<canvas id="c"></canvas>
<div class="top">
  <div class="eyebrow">Live2D · Cubism · pixi-live2d-display</div>
  <h1>Live2D Lab</h1><div id="which" style="font:500 12px 'Zen Kaku Gothic New',sans-serif;color:var(--dim)">—</div>
  <div id="params">—</div>
  <div id="status">読込中…</div>
</div>
<div class="panel">
  <h2>表情</h2>
  <div class="row">
    <button class="btn" data-exp="1">exp_01</button><button class="btn" data-exp="2">exp_02</button><button class="btn" data-exp="3">exp_03</button><button class="btn" data-exp="4">exp_04</button><button class="btn" data-exp="5">exp_05</button>
  </div>
  <h2>モーション</h2>
  <div class="row">
    <button class="btn" data-motion="Idle:0">Idle</button><button class="btn" data-motion=":0">mtn_02</button><button class="btn" data-motion=":1">mtn_03</button>
  </div>
  <h2>口パク</h2>
  <div class="row">
    <button class="btn on" data-mouth="auto">モーション任せ</button><button class="btn" data-mouth="talk">しゃべる（合成）</button><button class="btn" data-mouth="audio">音声に同期（サンプル再生）</button>
  </div>
</div>
