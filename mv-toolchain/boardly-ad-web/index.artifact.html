<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Boardly Ad</title>
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Nunito:wght@800;900&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #2A2038; }
      .frame { position: fixed; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%, -50%) scale(var(--k, 1)); transform-origin: center; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 100px -30px rgba(0,0,0,.7); }
      .overlay { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(62,46,82,.55); backdrop-filter: blur(6px); cursor: pointer; }
      .overlay.hidden { display: none; }
      .play { width: 120px; height: 120px; border-radius: 50%; background: #D24E6C; border: 6px solid #F7F4EA; display: grid; place-items: center; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
      .play::after { content: ""; margin-left: 10px; border-left: 40px solid #F7F4EA; border-top: 24px solid transparent; border-bottom: 24px solid transparent; }
      .hud { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: flex; gap: 10px; }
      .hud button { appearance: none; cursor: pointer; border: 0; background: #F7F4EA; color: #3E2E52; font: 900 14px "Zen Maru Gothic", sans-serif; padding: 12px 20px; border-radius: 999px; }
      .scene { visibility: hidden; }
      body { font-family: "Zen Maru Gothic", sans-serif; color: #3E2E52; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }
      /* ---- palette ---- */
      .bg-cream { background: #E6E3D4; } .bg-pink { background: #D24E6C; } .bg-plum { background: #3E2E52; }
      .blob { position: absolute; border-radius: 48% 52% 45% 55% / 55% 45% 55% 45%; }
      .blob.pink { background: #D24E6C; } .blob.lav { background: #8B7BA8; } .blob.plum { background: #3E2E52; } .blob.lilac { background: #C4B8CC; }
      /* ---- cards ---- */
      .card { position: absolute; background: #F7F4EA; border: 3px solid #3E2E52; border-radius: 12px; }
      .card .bar { position: absolute; left: 12px; height: 7px; border-radius: 4px; background: #C4B8CC; }
      .card .bar.pink { background: #D24E6C; }
      .thumb { position: absolute; background: #C4B8CC; border-radius: 6px; overflow: hidden; }
      .thumb svg { width: 100%; height: 100%; display: block; }
      .win-head { position: absolute; left: 0; right: 0; top: 0; height: 22px; border-bottom: 3px solid #3E2E52; background: #E6E3D4; border-radius: 9px 9px 0 0; }
      .win-head.pink { background: #D24E6C; }
      .dot { position: absolute; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #3E2E52; }
      .sticky { background: #F3EBC6; }
      .pill { position: absolute; background: #D24E6C; color: #F7F4EA; font-weight: 900; border-radius: 999px; padding: 6px 18px; font-size: 20px; text-align: center; line-height: 1.2; }
      .badge { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: #D24E6C; color: #F7F4EA; font: 900 20px "Nunito", sans-serif; display: grid; place-items: center; border: 3px solid #F7F4EA; }
      .bubble { position: absolute; background: #F7F4EA; border: 3px solid #3E2E52; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 22px; }
      .bubble::after { content: ""; position: absolute; bottom: -12px; left: 22px; width: 16px; height: 16px; background: #F7F4EA; border-right: 3px solid #3E2E52; border-bottom: 3px solid #3E2E52; transform: rotate(45deg); }
      .txt { position: absolute; font-weight: 900; line-height: 1.15; white-space: nowrap; }
      .txt .ch { display: inline-block; }
      .pinkT { color: #D24E6C; } .creamT { color: #F7F4EA; }
      .underline { position: absolute; height: 10px; border-radius: 6px; background: #D24E6C; transform-origin: left center; }
      .sparkle { position: absolute; width: 22px; height: 22px; }
      .sparkle::before, .sparkle::after { content: ""; position: absolute; background: #D24E6C; border-radius: 3px; }
      .sparkle::before { left: 9px; top: 0; width: 4px; height: 22px; } .sparkle::after { top: 9px; left: 0; width: 22px; height: 4px; }
      .sparkle.lav::before, .sparkle.lav::after { background: #C4B8CC; }
      .impact { position: absolute; width: 4px; height: 22px; background: #D24E6C; border-radius: 3px; transform-origin: 50% 100%; }
      .cursor { position: absolute; width: 26px; height: 32px; }
      .panel { position: absolute; width: 190px; height: 210px; background: #3E2E52; border-radius: 16px; }
      .panel .icon { position: absolute; left: 30px; top: 30px; width: 130px; height: 110px; border: 3px solid #F7F4EA; border-radius: 12px; }
      .flowcard { position: absolute; width: 200px; height: 220px; background: #F7F4EA; border: 3px solid #3E2E52; border-radius: 16px; }
      .flowcard.dashed { border-style: dashed; background: transparent; }
      .lbl { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-weight: 900; font-size: 24px; color: #3E2E52; }
      .flowcard.dashed .lbl { color: #F7F4EA; }
      .btn { position: absolute; background: #3E2E52; color: #F7F4EA; font-weight: 900; font-size: 24px; padding: 14px 40px; border-radius: 999px; }
      .btn b { color: #D24E6C; }
      .cta-arrow { color: #D24E6C; }
      .ui { position: absolute; background: #F7F4EA; border: 3px solid #3E2E52; border-radius: 14px; overflow: hidden; }
      .ui .side { position: absolute; left: 0; top: 34px; bottom: 0; width: 90px; border-right: 3px solid #3E2E52; background: #EDE9DC; }
      .ui .side i { position: absolute; left: 18px; width: 54px; height: 9px; border-radius: 5px; background: #C4B8CC; }
      .ui .search { position: absolute; left: 120px; top: 44px; width: 220px; height: 26px; border: 3px solid #3E2E52; border-radius: 8px; background: #fff; }
      .ui .brand { position: absolute; left: 106px; top: 42px; font: 900 18px "Nunito", sans-serif; }
      .ui .brand b { display: inline-block; width: 22px; height: 22px; background: #D24E6C; color: #fff; border-radius: 5px; text-align: center; line-height: 22px; margin-right: 6px; }
      .ui .boardcard { position: absolute; width: 150px; height: 118px; background: #fff; border: 3px solid #3E2E52; border-radius: 10px; }
      .wordmark { position: absolute; font: 900 120px "Nunito", sans-serif; letter-spacing: -0.02em; }
      .wordmark .o { position: relative; display: inline-block; }
      .wordmark .o::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #D24E6C; }
      svg.draw path, svg.draw line { fill: none; stroke: #3E2E52; stroke-width: 3; stroke-dasharray: 8 8; }
      svg.arrow path { fill: none; stroke: #D24E6C; stroke-width: 4; stroke-linecap: round; }
    </style>
  </head>

      // 自己描画用: パス長をセット
      document.querySelectorAll("svg.draw path, svg.arrow path").forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = p.classList.contains("dash") ? "8 8" : `${L}`; p.dataset.len = L; p.style.strokeDashoffset = L; });
      document.querySelectorAll("svg.draw path").forEach((p) => { p.style.strokeDasharray = `${p.dataset.len}`; });

      // ---------- タイムライン ----------
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const pop = { scale: 0, opacity: 0, ease: "back.out(2)", duration: 0.45 };

      // A
      tl.fromTo(".a-el", pop, { scale: 1, opacity: 1, stagger: 0.07, ease: "back.out(2)", duration: 0.5 }, 0.05);
      tl.fromTo("#a-lines path", { strokeDashoffset: (i, el) => el.dataset.len }, { strokeDashoffset: 0, duration: 0.6, stagger: 0.1 }, 0.5);
      tl.fromTo("#a-t1 .ch", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.06, ease: "back.out(2)" }, 0.4);
      tl.fromTo("#a-q", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(3)" }, 0.75);
      tl.fromTo("#a-t2 .ch", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.05, ease: "back.out(2)" }, 0.85);
      tl.fromTo("#a-t3 .ch", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.05, ease: "back.out(2)" }, 1.15);
      tl.fromTo("#sA .sparkle", { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.1, ease: "back.out(3)" }, 1.4);
      // 円ワイプ (1.9–2.6)
      tl.fromTo("#wipe", { scale: 0.2, x: 0 }, { scale: 16, x: 500, duration: 0.65, ease: "power2.in" }, 1.9);
      // B
      tl.fromTo("#b-man", { y: 320, rotation: -6 }, { y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.6)" }, 2.1);
      tl.fromTo(".b-bub", { scale: 0, y: 30 }, { scale: 1, y: 0, duration: 0.45, stagger: 0.12, ease: "back.out(2.5)" }, 2.45);
      tl.fromTo(".b-card", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, stagger: 0.06, ease: "back.out(2)" }, 2.25);
      tl.to(".b-bub", { y: -8, duration: 0.5, ease: "sine.inOut", stagger: 0.1, yoyo: true, repeat: 1 }, 2.95);
      tl.fromTo("#b-t .ch", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, stagger: 0.05, ease: "power3.out" }, 2.5);
      tl.fromTo("#b-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 2.95);
      // C
      tl.fromTo("#c-win", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 3.55);
      tl.fromTo(".c-fall", { y: 0, opacity: 1 }, { y: 420, x: (i) => [200, 60, -200, -320][i], scale: 0.3, opacity: 0, duration: 0.45, stagger: 0.04, ease: "power2.in" }, 3.55);
      tl.set(".c-fall", { opacity: 0 }, 4.0);
      tl.fromTo("#sC .sparkle", { scale: 0 }, { scale: 1, duration: 0.25, stagger: 0.08 }, 3.6);
      // D
      tl.fromTo("#d-ui", { y: 500, rotation: 2 }, { y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.4)" }, 4.0);
      tl.fromTo(".d-card", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, stagger: 0.08, ease: "back.out(2)" }, 4.35);
      tl.fromTo(".d-tag", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.06 }, 4.5);
      tl.fromTo("#d-arrows path", { strokeDashoffset: (i, el) => el.dataset.len }, { strokeDashoffset: 0, duration: 0.25, stagger: 0.06 }, 4.8);
      tl.fromTo("#d-cur", { x: 120, y: 80, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 4.9);
      tl.fromTo("#sD .sparkle", { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.1, ease: "back.out(3)" }, 5.0);
      // E
      tl.fromTo("#e-sheet", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 5.5);
      tl.fromTo("#e-t1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.7);
      tl.fromTo("#e-t2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.85);
      tl.fromTo("#e-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 6.2);
      tl.fromTo(".e-p", { x: -400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, stagger: 0.15, ease: "back.out(1.4)" }, 5.9);
      tl.fromTo(".e-plus", { scale: 0 }, { scale: 1, duration: 0.3, stagger: 0.15, ease: "back.out(3)" }, 6.25);
      tl.fromTo("#e-woman", { x: 400 }, { x: 0, duration: 0.6, ease: "back.out(1.3)" }, 6.2);
      tl.fromTo("#e-drag", { x: 0, y: 0, opacity: 0 }, { opacity: 1, duration: 0.2 }, 6.6);
      tl.to("#e-drag", { x: -430, y: -40, duration: 0.7, ease: "power2.inOut" }, 6.75);
      tl.to("#e-cur", { x: -430, y: -40, duration: 0.7, ease: "power2.inOut" }, 6.75);
      tl.fromTo("#sE .impact", { scaleY: 0 }, { scaleY: 1, duration: 0.2, stagger: 0.05 }, 6.4);
      // F
      tl.fromTo("#f-t1", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 7.5);
      tl.fromTo("#f-t2", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 7.62);
      tl.fromTo("#f-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.3 }, 7.9);
      tl.fromTo(".f-c", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.14, ease: "back.out(1.6)" }, 7.6);
      tl.fromTo("#f-arrows path", { strokeDashoffset: (i, el) => el.dataset.len }, { strokeDashoffset: 0, duration: 0.3, stagger: 0.15 }, 7.9);
      tl.fromTo("#f-check", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 8.25);
      tl.fromTo("#sF .sparkle", { scale: 0 }, { scale: 1, duration: 0.25, stagger: 0.1 }, 8.1);
      // G
      tl.fromTo(".g-dev", { x: -500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, stagger: 0.1, ease: "back.out(1.3)" }, 8.5);
      tl.fromTo("#g-wm .ch", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.05, stagger: 0.07 }, 8.7);
      tl.fromTo(".g-imp", { scaleY: 0 }, { scaleY: 1, duration: 0.2, stagger: 0.05 }, 9.2);
      tl.fromTo("#g-tag", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 9.1);
      tl.fromTo("#g-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.3 }, 9.45);
      tl.fromTo("#g-btn", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.5)" }, 9.5);
      tl.fromTo("#g-sp", { scale: 0, rotation: -45 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(3)" }, 9.8);

      // 中央寄せの位置決め（フォント読込後の実測）
      const center = () => {
        const hl = document.getElementById("g-hl").getBoundingClientRect();
        const ul = document.getElementById("g-ul"); ul.style.left = hl.left + "px"; ul.style.width = hl.width + "px";
        const btn = document.getElementById("g-btn"); const bw = btn.getBoundingClientRect().width; btn.style.left = (640 - bw / 2) + "px";
        document.getElementById("g-sp").style.left = (640 + bw / 2 + 12) + "px";
        const e2 = document.getElementById("e-t2").getBoundingClientRect(); const eul = document.getElementById("e-ul");
        eul.style.left = (640 - e2.width / 2 + 2) + "px"; eul.style.width = "132px";
      };
      center();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(center);
      // HyperFrames ランタイムの代替: data-start/duration で各クリップの表示を切替
      document.querySelectorAll("#root [data-start]").forEach((el) => {
        if (el.tagName === "AUDIO") return;
        const st = Number(el.dataset.start), du = Number(el.dataset.duration);
        tl.set(el, { visibility: "visible" }, st);
        tl.set(el, { visibility: "hidden" }, st + du);
      });
      const bgm = document.getElementById("bgm");
      const overlay = document.getElementById("overlay");
      const fit = () => document.documentElement.style.setProperty("--k", Math.min(innerWidth / 1320, innerHeight / 800));
      fit(); addEventListener("resize", fit);
      function start() { overlay.classList.add("hidden"); tl.pause(0); bgm.currentTime = 0; bgm.volume = 0.7; bgm.play().catch(() => {}); tl.play(0); }
      overlay.addEventListener("click", start);
      document.getElementById("replay").addEventListener("click", start);
      document.getElementById("pause").addEventListener("click", (e) => { if (tl.paused()) { tl.play(); bgm.play(); e.target.textContent = "一時停止"; } else { tl.pause(); bgm.pause(); e.target.textContent = "再開"; } });
      tl.eventCallback("onComplete", () => { overlay.classList.remove("hidden"); });
      window.__timelines["boardly-ad"] = tl;
    </script>
  </body>
</html>
